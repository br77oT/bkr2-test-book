Ruby, the ship's youngest engineer, hung upside down from an access hatch, and Old Pete stirred his tea like nothing in the galaxy could hurry him.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"5\">“There it is again,”</span> <span class=\"sentence\" data-sentence=\"6\">said Vega.</span> <span class=\"sentence\" data-sentence=\"7\">“Same pulse, same interval.</span> <span class=\"sentence\" data-sentence=\"8\">That's no echo.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"9\">“It's a distress beacon,”</span> <span class=\"sentence\" data-sentence=\"10\">said Moss.</span> <span class=\"sentence\" data-sentence=\"11\">“Or something pretending to be one.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"12\">“Pretending?”</span> <span class=\"sentence\" data-sentence=\"13\">asked Ruby.</span> <span class=\"sentence\" data-sentence=\"14\">“Beacons don't pretend.</span> <span class=\"sentence\" data-sentence=\"15\">Beacons beep.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"16\">“You've never met a smart beacon,”</span> <span class=\"sentence\" data-sentence=\"17\">said Moss.</span> <span class=\"sentence\" data-sentence=\"18\">“I have.</span> <span class=\"sentence\" data-sentence=\"19\">Lost a crew to one.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"20\">Vega straightened up.</span> <span class=\"sentence\" data-sentence=\"21\">“Distance?”</span> <span class=\"sentence\" data-sentence=\"22\">she asked.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"23\">“Forty thousand kilometers,”</span> <span class=\"sentence\" data-sentence=\"24\">said Ruby.</span> <span class=\"sentence\" data-sentence=\"25\">“Give or take a wreck or two.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"26\">“Take us in slow,”</span> <span class=\"sentence\" data-sentence=\"27\">said Vega.</span> <span class=\"sentence\" data-sentence=\"28\">“Pete, you have the helm.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"29\">“Aye, slow it is,”</span> <span class=\"sentence\" data-sentence=\"30\">said Pete.</span> <span class=\"sentence\" data-sentence=\"31\">“Slow keeps you breathing.</span> <span class=\"sentence\" data-sentence=\"32\">I've buried enough friends who liked fast.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"33\">The Magpie's engines hummed to life, and the debris field slid past the viewports like a broken necklace.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"34\">“Captain, I want it on record that I object to this,”</span> <span class=\"sentence\" data-sentence=\"35\">said Moss.</span> <span class=\"sentence\" data-sentence=\"36\">“Loudly and in writing.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"37\">“Noted, Doctor,”</span> <span class=\"sentence\" data-sentence=\"38\">said Vega.</span> <span class=\"sentence\" data-sentence=\"39\">“File it between my two other regrets.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"40\">“Which are?”</span> <span class=\"sentence\" data-sentence=\"41\">asked Moss.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"42\">“Hiring you, and running out of coffee,”</span> <span class=\"sentence\" data-sentence=\"43\">said Vega.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"44\">Ruby laughed so hard she nearly fell out of the hatch.</span></p>\n\n<h2><span class=\"sentence\" data-sentence=\"45\">Scene Two: The Wreck</span></h2>\n\n<p><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgMzYwIiB3aWR0aD0iODAwIiBoZWlnaHQ9IjM2MCI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9InZvaWQiIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwJSIgc3RvcC1jb2xvcj0iIzBjMTMyMiIvPgogICAgICA8c3RvcCBvZmZzZXQ9IjEwMCUiIHN0b3AtY29sb3I9IiMwNDA2MGMiLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9IndyZWNraHVsbCIgeDE9IjAiIHkxPSIwIiB4Mj0iMSIgeTI9IjAuNCI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29 1NyIvPgogICAgPHJlY3QgeD0iNDIwIiB5PSIzMTUiIHdpZHRoPSIzMCIgaGVpZ2h0PSI5IiB0cmFuc2Zvcm09InJvdGF0ZSgyNCA0MzUgMzIwKSIgZmlsbD0iIzNjNDY1NyIvPgogIDwvZz4KICA8dGV4dCB4PSI0MDAiIHk9IjM0NSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC1mYW1pbHk9Ikdlb3JnaWEsIHNlcmlmIiBmb250LXNpemU9IjE1IiBmaWxsPSIjOGVhMGJkIiBvcGFjaXR5PSIwLjgiPlRoZSB3cmVjazogYSBodWxsIGJyZWFjaGVkIGFuZCBsb25nIGdvbmUgZGFyazwvdGV4dD4KPC9zdmc+Cg==\" alt=\"The derelict wreck, hull breached and dark\" style=\"width:100%;height:auto;border-radius:8px;\"></p>\n\n<p><span class=\"sentence\" data-sentence=\"46\">The beacon led them to a hull the size of a cathedral, split open along its spine.</span> <span class=\"sentence\" data-sentence=\"47\">Frost glittered on the torn metal.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"48\">“That's a colony ship,”</span> <span class=\"sentence\" data-sentence=\"49\">said Pete.</span> <span class=\"sentence\" data-sentence=\"50\">“The Meridian class.</span> <span class=\"sentence\" data-sentence=\"51\">They stopped building those before you were born, Ruby.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"52\">“It's beautiful,”</span> <span class=\"sentence\" data-sentence=\"53\">said Ruby.</span> <span class=\"sentence\" data-sentence=\"54\">“Sad and beautiful.</span> <span class=\"sentence\" data-sentence=\"55\">Like a whale skeleton.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"56\">“It's a tomb,”</span> <span class=\"sentence\" data-sentence=\"57\">said Moss.</span> <span class=\"sentence\" data-sentence=\"58\">“And tombs are best left sealed.</span> <span class=\"sentence\" data-sentence=\"59\">Captain, turn us around.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"60\">“Not yet,”</span> <span class=\"sentence\" data-sentence=\"61\">said Vega.</span> <span class=\"sentence\" data-sentence=\"62\">“Ruby, what's powering that beacon?”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"63\">Ruby ran her scanner across the wreck.</span> <span class=\"sentence\" data-sentence=\"64\">“Auxiliary cells, deep in the core,”</span> <span class=\"sentence\" data-sentence=\"65\">she said.</span> <span class=\"sentence\" data-sentence=\"66\">“They should have died decades ago.</span> <span class=\"sentence\" data-sentence=\"67\">Someone's been feeding them.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"68\">“Someone!”</span> <span class=\"sentence\" data-sentence=\"69\">Moss cried.</span> <span class=\"sentence\" data-sentence=\"70\">“You mean something is alive in there!”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"71\">“Easy, Doctor,”</span> <span class=\"sentence\" data-sentence=\"72\">said Vega.</span> <span class=\"sentence\" data-sentence=\"73\">“Suit up.</span> <span class=\"sentence\" data-sentence=\"74\">Ruby, you're with me.</span> <span class=\"sentence\" data-sentence=\"75\">Pete, keep the engines warm.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"76\">“Warm engines, cold feet,”</span> <span class=\"sentence\" data-sentence=\"77\">said Pete.</span> <span class=\"sentence\" data-sentence=\"78\">“That's the salvager's prayer.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"79\">The boarding party crossed in silence.</span> <span class=\"sentence\" data-sentence=\"80\">Inside the wreck, their lamps carved white tunnels through the dark.</span> <span class=\"sentence\" data-sentence=\"81\">Vega went first, then Ruby, then Moss, who muttered the whole way.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"82\">“I hear it,”</span> <span class=\"sentence\" data-sentence=\"83\">said Ruby.</span> <span class=\"sentence\" data-sentence=\"84\">“The beacon.</span> <span class=\"sentence\" data-sentence=\"85\">It's close.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"86\">“Through that bulkhead,”</span> <span class=\"sentence\" data-sentence=\"87\">said Vega.</span> <span class=\"sentence\" data-sentence=\"88\">“Moss, get the door.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"89\">“Why is it always me and the doors?”</span> <span class=\"sentence\" data-sentence=\"90\">asked Moss.</span> <span class=\"sentence\" data-sentence=\"91\">“I'm a physician, not a locksmith.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"92\">“Because you complain the loudest,”</span> <span class=\"sentence\" data-sentence=\"93\">said Vega.</span> <span class=\"sentence\" data-sentence=\"94\">“Door.</span> <span class=\"sentence\" data-sentence=\"95\">Now.”</span></p>\n\n<h2><span class=\"sentence\" data-sentence=\"96\">Scene Three: The Survivor</span></h2>\n\n<p><img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA4MDAgMzYwIiB3aWR0aD0iODAwIiBoZWlnaHQ9IjM2MCI+CiAgPGRlZnM+CiAgICA8cmFkaWFsR3JhZGllbnQgaWQ9Imdsb3ciIGN4PSI1MCUiIGN5PSI0NSUiIHI9IjYwJSI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiMxMjMyNGEiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSIjMDUwYTEyIi8+CiAgICA8L3JhZGlhbEdyYWRpZW50PgogICAgPHJhZGlhbEdyYWRpZW50IGlkPSJwb2QiIGN4PSI1MCUiIGN5PSI0MCUiIHI9IjcwJSI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCUiIHN0b3AtY29sb3I9IiNiZmUzZmYiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSI2MCUiIHN0b3AtY29sb3I9IiM0ZjdmYTYiLz4KICAgICAgPHN0b3Agb2Zmc2V0PSIxMDAlIiBzdG9wLWNvbG9yPSIjMjUzODRiIi8+CiAgICA8L3JhZGlhbEdyYWRpZW50PgogIDwvZGVmcz4KICA8cmVjdCB3aWR0aD0iODAwIiBoZWlnaHQ9IjM2MCIgZmlsbD0idXJsKCNnbG93KSIvPgogIDxnIGZpbGw9IiNjM2QyZWUiPgogICAgPGNpcmNsZSBjeD0iMTIwIiBjeT0iNTAiIHI9IjEuMiIvPjxjaXJjbGUgY3g9IjI2MCIgY3k9IjMwIiByPSIxIi8+PGNpcmNsZSBjeD0iNTQwIiBjeT0iNDUiIHI9IjEuMyIvPgogICAgPGNpcmNsZSBjeD0iNjgwIiBjeT0iNzAiIHI9IjEiLz48Y2lyY2xlIGN4PSI3MDAiIGN5PSIzMCIgcj0iMS4yIi8+CiAgPC9nPgogIDwhLS0gY3J5byAvIGVzY2FwZSBwb2QgLS0+CiAgPGcgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoNDAwIDE5MCkiPgogICAgPGVsbGlwc2UgY3g9IjAiIGN5PSIwIiByeD0iMTUwIiByeT0iODYiIGZpbGw9IiMxYTI3MzUiLz4KICAgIDxlbGxpcHNlIGN4PSIwIiBjeT0iMCIgcng9IjEzMCIgcnk9IjcwIiBmaWxsPSJ1cmwoI3BvZCkiIG9wYWNpdHk9IjAuOTIiLz4KICAgIDwhLS0gcmluZyBmcmFtZSAtLT4KICAgIDxlbG ata-sentence=\"108\">asked Vega.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"109\">“I can,”</span> <span class=\"sentence\" data-sentence=\"110\">said Moss.</span> <span class=\"sentence\" data-sentence=\"111\">“The question is whether I should.</span> <span class=\"sentence\" data-sentence=\"112\">Waking is a shock.</span> <span class=\"sentence\" data-sentence=\"113\">A hundred years of sleep is a bigger one.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"114\">“We're not leaving them here,”</span> <span class=\"sentence\" data-sentence=\"115\">said Vega.</span> <span class=\"sentence\" data-sentence=\"116\">“Do it.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"117\">Moss worked the pod's ancient controls with surprising gentleness.</span> <span class=\"sentence\" data-sentence=\"118\">“Steady now,”</span> <span class=\"sentence\" data-sentence=\"119\">he said.</span> <span class=\"sentence\" data-sentence=\"120\">“Warming the blood.</span> <span class=\"sentence\" data-sentence=\"121\">Clearing the lungs.</span> <span class=\"sentence\" data-sentence=\"122\">Come on, come back to us.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"123\">The pod hissed.</span> <span class=\"sentence\" data-sentence=\"124\">A young woman opened her eyes and screamed.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"125\">“You're safe!”</span> <span class=\"sentence\" data-sentence=\"126\">said Ruby.</span> <span class=\"sentence\" data-sentence=\"127\">“You're safe, you're safe.</span> <span class=\"sentence\" data-sentence=\"128\">We've got you.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"129\">“Where—”</span> <span class=\"sentence\" data-sentence=\"130\">The woman's voice cracked.</span> <span class=\"sentence\" data-sentence=\"131\">“Where is everyone?”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"132\">“Gone,”</span> <span class=\"sentence\" data-sentence=\"133\">said Vega.</span> <span class=\"sentence\" data-sentence=\"134\">“I'm sorry.</span> <span class=\"sentence\" data-sentence=\"135\">You're the last.</span> <span class=\"sentence\" data-sentence=\"136\">What's your name?”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"137\">“Lena,”</span> <span class=\"sentence\" data-sentence=\"138\">she said.</span> <span class=\"sentence\" data-sentence=\"139\">“I was only supposed to sleep for six months.</span> <span class=\"sentence\" data-sentence=\"140\">The engines failed, didn't they?</span> <span class=\"sentence\" data-sentence=\"141\">I told them the engines would fail.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"142\">“A hundred years ago, you told them,”</span> <span class=\"sentence\" data-sentence=\"143\">said Moss.</span> <span class=\"sentence\" data-sentence=\"144\">“For what it's worth, you were right.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"145\">“A hundred years?”</span> <span class=\"sentence\" data-sentence=\"146\">Lena whispered.</span> <span class=\"sentence\" data-sentence=\"147\">“Everyone I knew is dust, and I was right.</span> <span class=\"sentence\" data-sentence=\"148\">What a terrible prize.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"149\">Pete's voice crackled over the comm.</span> <span class=\"sentence\" data-sentence=\"150\">“Captain, whatever you're doing, do it faster.</span> <span class=\"sentence\" data-sentence=\"151\">The wreck is shifting.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"152\">“Copy that,”</span> <span class=\"sentence\" data-sentence=\"153\">said Vega.</span> <span class=\"sentence\" data-sentence=\"154\">“Everybody moves.</span> <span class=\"sentence\" data-sentence=\"155\">Lena, can you walk?”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"156\">“I can run,”</span> <span class=\"sentence\" data-sentence=\"157\">said Lena.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"158\">“Good answer,”</span> <span class=\"sentence\" data-sentence=\"159\">said Ruby.</span></p>\n\n<h2><span class=\"sentence\" data-sentence=\"160\">Scene Four: The Way Home</span></h2>\n\n<p><span class=\"sentence\" data-sentence=\"161\">They cleared the wreck as its spine folded in on itself, slow and silent as a closing hand.</span> <span class=\"sentence\" data-sentence=\"162\">From the Magpie's bridge, Lena watched the colony ship disappear into the debris.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"163\">“So what happens to me now?”</span> <span class=\"sentence\" data-sentence=\"164\">asked Lena.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"165\">“Now you eat something,”</span> <span class=\"sentence\" data-sentence=\"166\">said Vega.</span> <span class=\"sentence\" data-sentence=\"167\">“Then you sleep in a bed that doesn't have a lid.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"168\">“And then?”</span> <span class=\"sentence\" data-sentence=\"169\">asked Lena.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"170\">“Then you pick a direction,”</span> <span class=\"sentence\" data-sentence=\"171\">said Vega.</span> <span class=\"sentence\" data-sentence=\"172\">“That's all any of us do.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"173\">“She can have my bunk,”</span> <span class=\"sentence\" data-sentence=\"174\">said Ruby.</span> <span class=\"sentence\" data-sentence=\"175\">“I sleep in the engine room anyway.</span> <span class=\"sentence\" data-sentence=\"176\">The hum is soothing.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"177\">“That hum is a bearing I have asked you to replace four times,”</span> <span class=\"sentence\" data-sentence=\"178\">said Pete.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"179\">“And I will,”</span> <span class=\"sentence\" data-sentence=\"180\">said Ruby.</span> <span class=\"sentence\" data-sentence=\"181\">“When it stops singing to me.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"182\">Moss appeared with a tray of steaming cups.</span> <span class=\"sentence\" data-sentence=\"183\">“Tea,”</span> <span class=\"sentence\" data-sentence=\"184\">he said.</span> <span class=\"sentence\" data-sentence=\"185\">“Medicinal.</span> <span class=\"sentence\" data-sentence=\"186\">Doctor's orders, no arguments.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"187\">Lena took a cup and held it like something holy.</span> <span class=\"sentence\" data-sentence=\"188\">“The last tea I drank was a hundred years old,”</span> <span class=\"sentence\" data-sentence=\"189\">she said.</span> <span class=\"sentence\" data-sentence=\"190\">“I suppose this one is fresher.”</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"191\">“Marginally,”</span> <span class=\"sentence\" data-sentence=\"192\">said Moss.</span></p>\n\n<p><span class=\"sentence\" data-sentence=\"193\">For the first time in a century, Lena laughed.</span> <span class=\"sentence\" data-sentence=\"194\">It was a small sound, but the bridge felt warmer for it, and the Magpie sailed on through the dark with five souls aboard instead of four.</span></p>","sentences":[],"audio":"audio/0.mp3","timestamps":[{"index":0,"start":0},{"index":1,"start":1.7396371882086168},{"index":2,"start":3.653424036281179},{"index":3,"start":7.691836734693878},{"index":4,"start":14.79528344671202},{"index":5,"start":22.630158730158733},{"index":6,"start":24.079546485260774},{"index":7,"start":25.23868480725624},{"index":8,"start":27.651700680272114},{"index":9,"start":29.600317460317466},{"index":10,"start":31.003265306122454},{"index":11,"start":32.15079365079365},{"index":12,"start":34.04136054421769},{"index":13,"start":35.08439909297052},{"index":14,"start":36.32480725623582},{"index":15,"start":37.867074829931965},{"index":16,"start":38.9101133786848},{"index":17,"start":40.580090702947835},{"index":18,"start":41.69278911564624},{"index":19,"start":42.36430839002266},{"index
